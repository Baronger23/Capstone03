apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: copilot-user-memory-migration-policy
  namespace: techx-tf3
  annotations:
    mandate-17.techx.io/service-clusterip-evidence: "2026-07-30:kube-dns=172.20.0.10"
    mandate-17.techx.io/managed-datastore-evidence: "2026-07-30:rds=10.0.47.14:5432;stable-peers=10.0.0.0/20,10.0.16.0/20,10.0.32.0/20"
    mandate-17.techx.io/public-egress-control: "no-public-egress; DNS + RDS 5432 only"
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: copilot-user-memory-schema-migration
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
        - ipBlock:
            cidr: 172.20.0.10/32
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - ipBlock:
            cidr: 10.0.0.0/20
        - ipBlock:
            cidr: 10.0.16.0/20
        - ipBlock:
            cidr: 10.0.32.0/20
      ports:
        - protocol: TCP
          port: 5432
