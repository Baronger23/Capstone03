apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: checkout-hpa
  namespace: techx-tf3
spec:
  # checkout now migrates through checkout-rollout. Target the Rollout scale
  # subresource so HPA retains REL-01's minReplicas=2 during each canary step.
  scaleTargetRef:
    { apiVersion: argoproj.io/v1alpha1, kind: Rollout, name: checkout-rollout }
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        { name: cpu, target: { type: Utilization, averageUtilization: 65 } }
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Percent
          value: 100
          periodSeconds: 60
        - type: Pods
          value: 4
          periodSeconds: 60
      selectPolicy: Max
    scaleDown:
      stabilizationWindowSeconds: 120
