    # Mandate-19 capacity step (30/07/2026): product-catalog đạt đúng 65%/65% ở
    # 6/8 tại stage vỡ, và là downstream của product-detail — đường đã sinh 565 lỗi
    # 500 ở 1800 user. Nới 8 -> 12 để nó không chặn sau khi frontend được nới.
    mandate-19.techx.io/capacity-step: "2026-07-30"
spec:
  scaleTargetRef:
    { apiVersion: apps/v1, kind: Deployment, name: product-catalog }
  minReplicas: 2
  maxReplicas: 12
  metrics:
    - type: Resource
      resource:
        { name: cpu, target: { type: Utilization, averageUtilization: 65 } }
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Percent
          value: 100
          periodSeconds: 60
        - type: Pods
          value: 4
          periodSeconds: 60
      selectPolicy: Max
    scaleDown:
      stabilizationWindowSeconds: 120
