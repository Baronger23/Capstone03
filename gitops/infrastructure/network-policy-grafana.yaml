apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: grafana-network-policy
  namespace: techx-tf3
  annotations:
    mandate-17.techx.io/service-clusterip-evidence: "2026-07-25:kube-dns=172.20.0.10,prometheus=172.20.123.8,jaeger=172.20.93.48,opensearch=172.20.106.195"
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: techx-corp
      app.kubernetes.io/name: grafana
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # REL-17: cloudflared proxies grafana.arthur-ngo.org straight to this Service -
    # deny-all here silently drops that traffic (connection hangs, Cloudflare edge times
    # out and returns 502). Grafana stays unreachable from anywhere else - this only
    # opens the door for the in-cluster cloudflared pods, still gated by Cloudflare
    # Access (SSO) at the edge for anyone external.
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: cloudflared
      ports:
        # NetworkPolicy ports match the DESTINATION port on the target pod, AFTER the
        # Service DNATs port 80 -> targetPort. The grafana Service is 80 -> named port
        # "grafana" = containerPort 3000, so the packet reaches this pod on 3000, not 80.
        # Allowing 80 here silently dropped everything (i/o timeout -> Cloudflare 502).
        - protocol: TCP
          port: 3000
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
        - ipBlock:
            cidr: 172.20.0.10/32
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
        - ipBlock:
            cidr: 172.20.123.8/32
      ports:
        - protocol: TCP
          port: 9090
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: jaeger
        - ipBlock:
            cidr: 172.20.93.48/32
      ports:
        - protocol: TCP
          port: 16685
        - protocol: TCP
          port: 16686
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: opensearch
        - ipBlock:
            cidr: 172.20.106.195/32
      ports:
        - protocol: TCP
          port: 9200
    # Grafana sidecars watch ConfigMaps through the private Kubernetes API.
    - to:
        - ipBlock:
            cidr: 172.20.0.1/32
        - ipBlock:
            cidr: 10.0.0.0/16
      ports:
        - protocol: TCP
          port: 443
