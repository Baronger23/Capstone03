apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: grafana-network-policy
  namespace: techx-tf3
  annotations:
    mandate-17.techx.io/cni-path-evidence: "2026-07-27:aws-vpc-cni-v1.22.4,standard,policyendpoint-pod-ip-resolution"
    mandate-17.techx.io/kubernetes-api-egress: "private-control-plane-subnets:10.0.0.0/20,10.0.16.0/20,10.0.32.0/20"
    mandate-17.techx.io/kubernetes-api-endpoint-evidence: "2026-07-27:10.0.23.132,10.0.8.89"
    mandate-17.techx.io/kubernetes-api-service-evidence: "2026-07-27:kubernetes.default.svc=172.20.0.1"
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: techx-corp
      app.kubernetes.io/name: grafana
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # REL-17: cloudflared proxies grafana.arthur-ngo.org straight to this Service -
    # deny-all here silently drops that traffic (connection hangs, Cloudflare edge times
    # out and returns 502). Grafana stays unreachable from anywhere else - this only
    # opens the door for the in-cluster cloudflared pods, still gated by Cloudflare
    # Access (SSO) at the edge for anyone external.
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: cloudflared
      ports:
        # NetworkPolicy ports match the DESTINATION port on the target pod, AFTER the
        # Service DNATs port 80 -> targetPort. The grafana Service is 80 -> named port
        # "grafana" = containerPort 3000, so the packet reaches this pod on 3000, not 80.
        # Allowing 80 here silently dropped everything (i/o timeout -> Cloudflare 502).
        - protocol: TCP
          port: 3000
  # No public egress is required: PM-176 bakes the OpenSearch plugin into the
  # digest-pinned Grafana image and runtime plugin installation is disabled.
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
      ports:
        - protocol: TCP
          port: 9090
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: jaeger
      ports:
        - protocol: TCP
          port: 16685
        - protocol: TCP
          port: 16686
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: opensearch
      ports:
        - protocol: TCP
          port: 9200
    # Grafana sidecars watch ConfigMaps through the Kubernetes API Service. Keep the
    # Service VIP for the in-cluster API path and the three private subnets for the
    # post-DNAT control-plane ENIs, which may rotate.
    - to:
        - ipBlock:
            cidr: 172.20.0.1/32
        - ipBlock:
            cidr: 10.0.0.0/20
        - ipBlock:
            cidr: 10.0.16.0/20
        - ipBlock:
            cidr: 10.0.32.0/20
      ports:
        - protocol: TCP
          port: 443
