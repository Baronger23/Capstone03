apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: shopping-copilot-business-policy
  namespace: techx-tf3
  annotations:
    mandate-17.techx.io/service-clusterip-evidence: "2026-07-30:kube-dns=172.20.0.10,product-catalog=172.20.145.185,cart=172.20.165.232,product-reviews=172.20.242.200,recommendation=172.20.109.11,currency=172.20.98.73,shipping=172.20.58.251,otel-gateway=172.20.117.175"
    mandate-17.techx.io/managed-datastore-evidence: "2026-07-30:rds=5432,elasticache=6379 via stable-peers=10.0.0.0/20,10.0.16.0/20,10.0.32.0/20"
    mandate-17.techx.io/ingress-caller-evidence: "2026-07-30:frontend-proxy(/api/copilot allowlist)+cloudflared(SSO /chatbot) to shopping-copilot:8001"
    mandate-17.techx.io/public-egress-control: "TEMPORARY direct 443 for Bedrock/S3/STS - see comment; product-reviews uses an egress proxy instead"
spec:
  # shopping-copilot lives in gitops/shopping-copilot/, outside the techx-corp chart, so it
  # uses `app:` rather than app.kubernetes.io/component. It had no policy of its own, which
  # was harmless until default-deny-all went live - after that the pod was fully isolated
  # (frontend-proxy -> copilot timed out, and the copilot could not reach RDS, ElastiCache,
  # Bedrock or any gRPC service), taking the storefront chat down while the pod stayed Ready.
  podSelector:
    matchLabels:
      app: shopping-copilot
  policyTypes: [Ingress, Egress]
  ingress:
    # Two callers only: the public storefront path (Envoy, /api/copilot allowlist) and the
    # SSO-fronted /chatbot UI (cloudflared -> Service directly, not through Envoy).
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: frontend-proxy
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: cloudflared
      ports:
        - { protocol: TCP, port: 8001 }
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
        - ipBlock: { cidr: 172.20.0.10/32 }
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
    # Agent tools over gRPC/HTTP. Every rule pairs podSelector with the Service ClusterIP:
    # on VPC CNI a podSelector alone does not cover ClusterIP-addressed traffic (the 20/07
    # outage, postmortem 0012).
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: product-catalog
        - ipBlock: { cidr: 172.20.145.185/32 }
      ports:
        - { protocol: TCP, port: 8080 }
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: cart
        - ipBlock: { cidr: 172.20.165.232/32 }
      ports:
        - { protocol: TCP, port: 8080 }
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: product-reviews
        - ipBlock: { cidr: 172.20.242.200/32 }
      ports:
        - { protocol: TCP, port: 3551 }
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: recommendation
        - ipBlock: { cidr: 172.20.109.11/32 }
      ports:
        - { protocol: TCP, port: 8080 }
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: currency
        - ipBlock: { cidr: 172.20.98.73/32 }
      ports:
        - { protocol: TCP, port: 8080 }
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: shipping
        - ipBlock: { cidr: 172.20.58.251/32 }
      ports:
        - { protocol: TCP, port: 8080 }
    # RDS PostgreSQL (catalog/reviews reads) and ElastiCache Valkey (session, cache,
    # long-term memory). Both sit in the private subnets, addressed by CIDR because their
    # ENI addresses are not stable.
    - to:
        - ipBlock: { cidr: 10.0.0.0/20 }
        - ipBlock: { cidr: 10.0.16.0/20 }
        - ipBlock: { cidr: 10.0.32.0/20 }
      ports:
        - { protocol: TCP, port: 5432 }
        - { protocol: TCP, port: 6379 }
    # Bedrock / S3 / STS egress is deliberately NOT included here.
    #
    # The Mandate-17 contract test (test_public_egress_is_blocked_from_promotion_and_never_active)
    # forbids any public CIDR in an active policy, and the in-VPC Bedrock endpoints
    # (ai-runtime-vpc-endpoints.tf) carry endpoint policies scoped to the product-reviews IRSA
    # role, so the copilot cannot use them either. product-reviews solves this with
    # product-reviews-egress-proxy:3128, whose allowedAuthorities currently lists only
    # sts.us-east-1 and bedrock-runtime.us-east-1.
    #
    # So with this policy alone the copilot is reachable again and its DB/cache/gRPC tools
    # work, but Bedrock calls still fail and the agent answers with its fallback message.
    # Full restore needs a CDO01 decision - see the PR description:
    #   widen allowedAuthorities (bedrock-runtime.ap-southeast-1, bedrock-agent-runtime.us-east-1,
    #   sts.ap-southeast-1) and set HTTPS_PROXY on the copilot, or grant the copilot role on the
    #   VPC endpoint policies.
