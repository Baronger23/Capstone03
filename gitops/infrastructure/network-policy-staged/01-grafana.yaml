apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: grafana-platform-egress
  namespace: techx-tf3
  annotations:
    mandate-17.techx.io/cni-path-evidence: "2026-07-27:aws-vpc-cni-v1.22.4,standard,policyendpoint-pod-ip-resolution"
    mandate-17.techx.io/kubernetes-api-egress: "private-control-plane-subnets:10.0.0.0/20,10.0.16.0/20,10.0.32.0/20"
    mandate-17.techx.io/kubernetes-api-endpoint-evidence: "2026-07-27:10.0.23.132,10.0.8.89"
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: techx-corp
      app.kubernetes.io/name: grafana
  policyTypes: [Egress]
  # PM-176 bakes the OpenSearch plugin into the image, so startup does not need
  # access to the public Grafana plugin catalogue.
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
      ports:
        - { protocol: TCP, port: 9090 }
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: jaeger
      ports:
        - { protocol: TCP, port: 16685 }
        - { protocol: TCP, port: 16686 }
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: opensearch
      ports:
        - { protocol: TCP, port: 9200 }
    # Grafana sidecars watch ConfigMaps through the private Kubernetes API. The EKS
    # control-plane ENIs may rotate, so allow only the three production private subnets.
    - to:
        - ipBlock: { cidr: 10.0.0.0/20 }
        - ipBlock: { cidr: 10.0.16.0/20 }
        - ipBlock: { cidr: 10.0.32.0/20 }
      ports:
        - { protocol: TCP, port: 443 }
