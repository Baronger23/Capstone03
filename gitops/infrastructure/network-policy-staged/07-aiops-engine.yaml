apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: aiops-engine-platform-policy
  namespace: techx-tf3
  annotations:
    mandate-17.techx.io/service-clusterip-evidence: "2026-07-29:kube-dns=172.20.0.10,prometheus=172.20.123.8,jaeger=172.20.93.48,opensearch=172.20.106.195,kubernetes.default.svc=172.20.0.1,aiops-egress-proxy=172.20.255.150"
    mandate-17.techx.io/kubernetes-api-dependency: "verified:remediation_handler executes kubectl dry-run/live remediation"
    mandate-17.techx.io/kubernetes-api-endpoint-evidence: "2026-07-29:10.0.10.183,10.0.42.215"
    mandate-17.techx.io/public-egress-control: "direct-public-egress-blocked; uses aiops-egress-proxy"
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: aiops-engine
  policyTypes: [Ingress, Egress]
  ingress: []
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
        - ipBlock:
            cidr: 172.20.0.10/32
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
        - ipBlock:
            cidr: 172.20.123.8/32
      ports:
        - { protocol: TCP, port: 9090 }
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: jaeger
        - ipBlock:
            cidr: 172.20.93.48/32
      ports:
        - { protocol: TCP, port: 16686 }
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: opensearch
        - ipBlock:
            cidr: 172.20.106.195/32
      ports:
        - { protocol: TCP, port: 9200 }
    - to:
        - ipBlock:
            cidr: 172.20.0.1/32
        - ipBlock:
            cidr: 10.0.0.0/20
        - ipBlock:
            cidr: 10.0.16.0/20
        - ipBlock:
            cidr: 10.0.32.0/20
      ports:
        - { protocol: TCP, port: 443 }
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: aiops-egress-proxy
              app.kubernetes.io/component: aiops-egress-proxy
        - ipBlock:
            cidr: 172.20.255.150/32
      ports:
        - { protocol: TCP, port: 3128 }
