# IRSA service account for the copilot pod. Role is created in Terraform
# (infra/modules/eks-platform/shopping-copilot-bedrock.tf) and grants ONLY Bedrock
# invoke/guardrail/retrieve + read-only S3 on the products bucket - no Bedrock on the
# shared workload SA. ARN is deterministic: ${cluster_name}-shopping-copilot-bedrock.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: shopping-copilot-sa
  namespace: techx-tf3
  labels:
    app: shopping-copilot
    app.kubernetes.io/part-of: techx-corp
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::197826770971:role/techx-corp-tf3-shopping-copilot-bedrock
