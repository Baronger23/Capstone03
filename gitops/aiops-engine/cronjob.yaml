# CronJob huấn luyện lại mô hình anomaly, 02:00 thứ Hai giờ VN (19:00 CN UTC).
#
# LƯU Ý DRIFT: image ở đây là IF-v25 trong khi engine chạy IF-v63 — lệch 38 bản.
# Giữ nguyên ở Phase 1 (nguyên tắc khớp live state). Nâng version là việc Phase 3,
# và phải hỏi AIO02 trước xem train_anomaly_model_eks.py ở IF-v63 còn tương thích.
#
# AWS_ACCESS_KEY_ID/SECRET cũng là static key — gỡ ở Phase 2 cùng lúc với Deployment.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: aiops-anomaly-training
  namespace: techx-tf3
spec:
  schedule: 0 19 * * 0
  concurrencyPolicy: Forbid
  suspend: false
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      activeDeadlineSeconds: 3600
      template:
        spec:
          restartPolicy: OnFailure
          dnsPolicy: ClusterFirst
          schedulerName: default-scheduler
          priorityClassName: low-priority
          terminationGracePeriodSeconds: 30
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          containers:
          - name: trainer
            # Digest-pinned; resolved from ECR for tag IF-v25. Without this the
            # weekly job would be rejected at admission once the external policy
            # enforces, and a cron failure is easy to miss for days.
            image: 197826770971.dkr.ecr.ap-southeast-1.amazonaws.com/tf-2-ai-engine:IF-v25@sha256:2600f9b0c332da4032f603cd4cb7086fefceb01f7206cbc7666282dbd02d9e74
            imagePullPolicy: Always
            command:
            - python
            - train_anomaly_model_eks.py
            env:
            - name: PROMETHEUS_URL
              value: http://prometheus.techx-tf3.svc.cluster.local:9090
            - name: AIOPS_S3_BUCKET
              value: tf3-aiops-models-197826770971
            - name: AWS_REGION
              value: ap-southeast-1
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: aiops-engine-secrets
                  key: aws-access-key-id
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: aiops-engine-secrets
                  key: aws-secret-access-key
            resources:
              requests:
                cpu: 500m
                memory: 512Mi
              limits:
                cpu: '1'
                memory: 1Gi
            securityContext:
              allowPrivilegeEscalation: false
              runAsNonRoot: true
              runAsUser: 1000
              capabilities:
                drop:
                - ALL
            terminationMessagePath: /dev/termination-log
            terminationMessagePolicy: File
