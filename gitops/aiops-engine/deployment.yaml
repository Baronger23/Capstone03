# Deployment aiops-engine (AIO02). Adopt vào ArgoCD 2026-07-28 — nội dung khớp
# nguyên trạng live state để sync đầu tiên không recreate pod.
#
# CHƯA sửa ở Phase 1, có chủ đích:
#   - AWS_ACCESS_KEY_ID/SECRET vẫn lấy từ secret (static key của aio2-admin-team).
#     Gỡ ở Phase 2 SAU khi IRSA role tf3-aiops-engine-irsa dựng xong trong Terraform.
#   - image dùng tag chứ chưa digest-pin; imagePullPolicy vẫn Always.
#   - annotation kubectl.kubernetes.io/restartedAt nằm trong pod template: xoá nó
#     sẽ đổi pod-template-hash và làm pod restart. Giữ nguyên.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aiops-engine
  namespace: techx-tf3
  labels:
    app: aiops-engine
    app.kubernetes.io/name: aiops-engine
spec:
  replicas: 1
  revisionHistoryLimit: 10
  progressDeadlineSeconds: 600
  selector:
    matchLabels:
      app: aiops-engine
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/restartedAt: '2026-07-25T14:43:11+07:00'
      labels:
        app: aiops-engine
        app.kubernetes.io/name: aiops-engine
    spec:
      serviceAccount: aiops-engine
      serviceAccountName: aiops-engine
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      schedulerName: default-scheduler
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: engine
        # Digest-pinned so the tag cannot be repointed underneath a running
        # release. This is the digest the pod already resolved IF-v63 to, read
        # from its imageID, so the workload comes back on the same bytes.
        image: 197826770971.dkr.ecr.ap-southeast-1.amazonaws.com/tf-2-ai-engine:IF-v63@sha256:eea1d559d4314d6a840a7de2dd8b0ebb673348bf4732917023cf20f426cab66c
        imagePullPolicy: Always
        ports:
        - name: http-metrics
          containerPort: 8000
          protocol: TCP
        env:
        - name: AIOPS_SIMULATION_MODE
          value: 'false'
        - name: PROMETHEUS_URL
          value: http://prometheus.techx-tf3.svc.cluster.local:9090
        - name: JAEGER_URL
          value: http://jaeger.techx-tf3.svc.cluster.local:16686/jaeger/ui
        - name: OPENSEARCH_URL
          value: http://opensearch.techx-tf3.svc.cluster.local:9200
        - name: SLACK_WEBHOOK_URL
          valueFrom:
            secretKeyRef:
              name: aiops-engine-secrets
              key: slack-webhook-url
              optional: true
        - name: AWS_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: aiops-engine-secrets
              key: aws-access-key-id
              optional: true
        - name: AWS_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: aiops-engine-secrets
              key: aws-secret-access-key
              optional: true
        - name: AWS_DEFAULT_REGION
          value: ap-southeast-1
        - name: BEDROCK_AWS_REGION
          value: us-east-1
        - name: BEDROCK_MODEL_ID
          value: amazon.nova-lite-v1:0
        - name: BEDROCK_KB_ID
          value: GH3FUCYVOJ
        resources:
          requests:
            cpu: 200m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8000
            scheme: HTTP
          initialDelaySeconds: 15
          periodSeconds: 10
          timeoutSeconds: 1
          successThreshold: 1
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /readyz
            port: 8000
            scheme: HTTP
          initialDelaySeconds: 30
          periodSeconds: 30
          timeoutSeconds: 1
          successThreshold: 1
          failureThreshold: 3
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
