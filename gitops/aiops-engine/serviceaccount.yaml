# ServiceAccount cho AIOps: engine và trainer dùng hai identity riêng.
#
# Vì sao tách: trainer chỉ query Prometheus rồi ghi model lên S3 — nó KHÔNG cần
# Bedrock và KHÔNG cần ghi prefix topology/. Hai role cho hai audit trail riêng
# trong CloudTrail. Role tương ứng dựng ở infra/modules/eks-platform/aiops-engine-irsa.tf.
#
# LƯU Ý: ở bước này pod VẪN chạy bằng static AWS key trong env, vì env var đè lên
# IRSA trong chuỗi credential provider của SDK. Gỡ 2 env đó là PR riêng ngay sau —
# tách ra để nếu pod lỗi thì biết là do annotation sai hay do thiếu quyền.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: aiops-engine
  namespace: techx-tf3
  labels:
    app.kubernetes.io/name: aiops-engine
  annotations:
    # Trước đây trỏ tf3-aiops-engine-irsa-role — role đó KHÔNG TỒN TẠI
    # (aws iam get-role trả NoSuchEntity), annotation chỉ là trang trí.
    eks.amazonaws.com/role-arn: arn:aws:iam::197826770971:role/techx-corp-tf3-aiops-engine
---
# ServiceAccount cho CronJob aiops-anomaly-training.
#
# Trước đây CronJob không khai serviceAccountName nên chạy bằng SA `default` của
# namespace. Job production không nên dùng `default`, và gắn IRSA vào `default`
# nghĩa là cấp quyền đó cho mọi workload khác cũng đang dùng chung nó.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: aiops-trainer
  namespace: techx-tf3
  labels:
    app.kubernetes.io/name: aiops-engine
    app.kubernetes.io/component: trainer
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::197826770971:role/techx-corp-tf3-aiops-trainer
