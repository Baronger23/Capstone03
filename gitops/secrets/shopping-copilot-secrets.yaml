# Shopping Copilot secrets (ESO). Nothing secret ever lives in a tracked file.
#
# Two secrets:
#   1. shopping-copilot-valkey-url — full ElastiCache VALKEY_URL (rediss:// TLS + auth, DB=1).
#      Verified 2026-07-27: ElastiCache techx-tf3-valkey is ClusterEnabled=false, TLS on,
#      Auth on -> redis.Redis.from_url(rediss://...:6379/1) works (non-cluster supports DB idx).
#   2. shopping-copilot-db — RDS username/password AS SEPARATE KEYS. The copilot's
#      connect.py reads DB_USER/DB_PASSWORD individually (it does NOT read a DSN), so we expose
#      the RDS-managed master creds as discrete keys here instead of the templated DSN that
#      techx-tf3-postgres-conn provides. Same RDS-managed secret ARN product-* already use.
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: shopping-copilot-db
  namespace: techx-tf3
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  target:
    name: shopping-copilot-db
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: username
      remoteRef:
        key: "arn:aws:secretsmanager:ap-southeast-1:197826770971:secret:rds!db-78563b84-b60e-454b-a26f-6c25602a02e8-EpAVVG"
        property: username
    - secretKey: password
      remoteRef:
        key: "arn:aws:secretsmanager:ap-southeast-1:197826770971:secret:rds!db-78563b84-b60e-454b-a26f-6c25602a02e8-EpAVVG"
        property: password
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: shopping-copilot-valkey-url
  namespace: techx-tf3
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  target:
    name: shopping-copilot-valkey-url
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engine: v2
      data:
        # Password is url-encoded so an AUTH token with URL-reserved characters can't break
        # the URL. Empty username (ElastiCache AUTH uses password only). DB index 1 per spec.
        url: "rediss://:{{ .auth_token | urlquery }}@master.techx-tf3-valkey.pkeslh.apse1.cache.amazonaws.com:6379/1"
  data:
    - secretKey: auth_token
      remoteRef:
        key: "techx-tf3/elasticache-auth"
        property: auth_token
