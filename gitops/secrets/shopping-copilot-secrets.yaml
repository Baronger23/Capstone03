# Shopping Copilot secrets (ESO). Renders the full ElastiCache Valkey connection URL so the
# app gets a single VALKEY_URL env var with TLS + auth baked in - no secret value ever lives
# in a tracked file. Reuses the same AWS Secrets Manager entry the cart's valkey-auth already
# reads (techx-tf3/elasticache-auth).
#
# ⚠️ AIO02 dependency: the copilot's Redis client MUST honour the rediss:// scheme (TLS) and
# the AUTH password from the URL. The service was originally built against the plaintext
# in-cluster valkey-cart (no TLS, no auth); confirm the client does TLS before relying on
# session/cache persistence. Also confirm logical DB index /1 is usable (unsupported if the
# ElastiCache replication group is cluster-mode-enabled). See the deploy runbook, Open Items.
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: shopping-copilot-valkey-url
  namespace: techx-tf3
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  target:
    name: shopping-copilot-valkey-url
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engine: v2
      data:
        # Password is url-encoded so an AUTH token with URL-reserved characters can't break
        # the URL. Empty username (ElastiCache AUTH uses password only). DB index 1 per spec.
        url: "rediss://:{{ .auth_token | urlquery }}@master.techx-tf3-valkey.pkeslh.apse1.cache.amazonaws.com:6379/1"
  data:
    - secretKey: auth_token
      remoteRef:
        key: "techx-tf3/elasticache-auth"
        property: auth_token
