# EXPECT ACCEPT (allow-approved-external-image-digests): exactly the catalogue
# entry, byte for byte.
#
# securityContext satisfies PodSecurity "restricted" so PodSecurity does not
# reject the pod before Kyverno evaluates it. Without this the request is
# refused for the wrong reason and proves nothing about image policy.
apiVersion: v1
kind: Pod
metadata:
  name: allow-02-approved-external
  namespace: techx-tf3
  labels:
    pm127-admission-test: "true"
spec:
  restartPolicy: Never
  securityContext:
    runAsNonRoot: true
    runAsUser: 10001
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: probe
      image: busybox@sha256:73aaf090f3d85aa34ee199857f03fa3a95c8ede2ffd4cc2cdb5b94e566b11662
      command: ["sleep", "300"]
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
