name: Build & Push AIOps Engine image

# PM-101-compliant build for the AIOps Engine image (tf-2-ai-engine): blocking Trivy gate
# BEFORE push, push by digest into an IMMUTABLE ECR repo, keyless Cosign signature +
# verification. The deployment pins the digest this workflow prints
# (gitops/aiops-engine/deployment.yaml and gitops/aiops-engine/cronjob.yaml).
#
# Requires the app source (aiops-engine/Dockerfile) to be present on the built ref.

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Override tag prefix (default: git short SHA)"
        required: false
        default: ""
  push:
    branches: [main]
    paths:
      - "aiops-engine/**"

concurrency:
  group: build-push-aiops-${{ github.ref }}
  cancel-in-progress: false

env:
  AWS_REGION: ap-southeast-1
  ECR_REGISTRY: 197826770971.dkr.ecr.ap-southeast-1.amazonaws.com
  ECR_REPOSITORY: tf-2-ai-engine
  TRIVY_SEVERITIES: HIGH,CRITICAL
  PLATFORM: linux/amd64

jobs:
  build-scan-sign:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0

      - name: Guard - production promotion only from main
        env:
          EVENT_NAME: ${{ github.event_name }}
          SOURCE_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = workflow_dispatch ] && [ "$SOURCE_REF" != refs/heads/main ]; then
            echo "FAIL: production image build may only be dispatched from main" >&2
            exit 1
          fi
          if [ ! -f aiops-engine/Dockerfile ]; then
            echo "FAIL: aiops-engine/Dockerfile not found on this ref - land the app source first" >&2
            exit 1
          fi

      - name: Resolve tag
        id: vars
        env:
          INPUT_IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          set -euo pipefail
          if [ -n "${INPUT_IMAGE_TAG:-}" ]; then
            [[ "$INPUT_IMAGE_TAG" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]] || {
              echo "FAIL: invalid image tag prefix" >&2; exit 1; }
            TAG_PREFIX="$INPUT_IMAGE_TAG"
          else
            TAG_PREFIX="$(git rev-parse --short=7 HEAD)"
          fi
          # ECR immutability makes a rerun fail closed rather than overwrite.
          TAG="${TAG_PREFIX}-${GITHUB_RUN_ID}"
          [ "${#TAG}" -le 128 ] || { echo "FAIL: tag exceeds 128 chars: $TAG" >&2; exit 1; }
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@d539f0932e70871a027e9d5a9d8fc38589180a64 # v2.1.6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Build local candidate for the Trivy gate
        env:
          TAG: ${{ steps.vars.outputs.tag }}
        run: |
          set -euo pipefail
          docker buildx build \
            --platform "$PLATFORM" \
            --file aiops-engine/Dockerfile \
            --tag "${ECR_REGISTRY}/${ECR_REPOSITORY}:${TAG}" \
            --output type=docker \
            aiops-engine

      - name: Install Trivy
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.72.0
          cache: true

      - name: Scan candidate with Trivy (blocking pre-push gate)
        env:
          TAG: ${{ steps.vars.outputs.tag }}
        run: |
          set -euo pipefail
          IMAGE="${ECR_REGISTRY}/${ECR_REPOSITORY}:${TAG}"
          mkdir -p trivy-reports
          # Full report (all findings, fixed or not) is kept as evidence.
          trivy image --scanners vuln --format json --output "trivy-reports/${ECR_REPOSITORY}.json" --no-progress "$IMAGE"
          # Match the common production pipeline: no ignored CVEs and no
          # exception for vulnerabilities that do not yet have a vendor fix.
          echo "Enforcing zero ${TRIVY_SEVERITIES} findings for $IMAGE"
          trivy image --scanners vuln --severity "$TRIVY_SEVERITIES" \
            --exit-code 1 --no-progress "$IMAGE"

      - name: Upload Trivy report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: trivy-aiops-${{ github.run_id }}
          path: trivy-reports/
          if-no-files-found: warn
          retention-days: 90

      - name: Push pre-scanned image and capture digest
        id: push
        env:
          TAG: ${{ steps.vars.outputs.tag }}
        run: |
          set -euo pipefail
          docker buildx build \
            --platform "$PLATFORM" \
            --file aiops-engine/Dockerfile \
            --tag "${ECR_REGISTRY}/${ECR_REPOSITORY}:${TAG}" \
            --metadata-file meta.json \
            --push \
            aiops-engine
          DIGEST="$(jq -r '.["containerimage.digest"]' meta.json)"
          if [ -z "$DIGEST" ] || [ "$DIGEST" = null ]; then
            echo "FAIL: no digest resolved" >&2
            exit 1
          fi
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign and verify the digest (keyless)
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          IMAGE="${ECR_REGISTRY}/${ECR_REPOSITORY}@${DIGEST}"
          EXPECTED_IDENTITY="https://github.com/${GITHUB_WORKFLOW_REF}"
          echo "Signing $IMAGE"
          cosign sign --yes "$IMAGE"
          echo "Verifying $IMAGE as $EXPECTED_IDENTITY"
          cosign verify \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity "$EXPECTED_IDENTITY" \
            "$IMAGE"

      - name: Summary - digest to pin
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          {
            echo "### AIOps Engine image built & signed"
            echo ""
            echo "Pin this in both \`gitops/aiops-engine/deployment.yaml\` and \`gitops/aiops-engine/cronjob.yaml\`:"
            echo ""
            echo '```'
            echo "image: ${ECR_REGISTRY}/${ECR_REPOSITORY}@${DIGEST}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
