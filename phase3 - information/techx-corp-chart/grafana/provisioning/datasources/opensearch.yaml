apiVersion: 1

datasources:
  - name: OpenSearch
    uid: webstore-logs
    type: grafana-opensearch-datasource
    url: http://opensearch:9200/
    access: proxy
    editable: true
    isDefault: false
    jsonData:
      # Use Grafana's time-pattern syntax so Save & Test resolves the current
      # daily index. A literal wildcard makes the plugin health endpoint call
      # an invalid index name even though the matching indices exist.
      database: "[otel-logs-]YYYY-MM-DD"
      flavor: opensearch
      logLevelField: severity.text.keyword
      logMessageField: body
      pplEnabled: true
      timeField: observedTimestamp
      version: 3.6.0
